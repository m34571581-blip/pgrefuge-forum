name: 同步论坛数据

# 拉 Discussions，脱敏后生成静态站与数据集
on:
  schedule:
    # GitHub 的 cron 用 UTC（北京时间 = UTC+8）
    # 每小时 17 分和 47 分各跑一次 → 最多 30 分钟延迟就能看到新帖
    # 每天 48 次 ≈ 每月 1440 次，公共仓库配额是每月 2000 次，安全
    - cron: '17,47 * * * *'
  # 手动触发：Actions 页面点 Run workflow
  workflow_dispatch:
  # 有新主题或新评论时也触发。
  # 注意：discussion 事件只在「本仓库内」创建/编辑讨论时触发，
  # 而用户是在自己的账号下回复评论 —— 那属于别的仓库的事件，
  # 这里的 issue_comment 收不到。所以下面额外加了 push 触发，
  # 保证「代码更新后能立刻重新同步一次」。
  discussion:
    types: [created, edited, deleted]
  issue_comment:
    types: [created, edited, deleted]
  # 代码或配置变更后重跑一次，让静态站立刻反映最新状态
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'site/**'
      - '.github/workflows/sync.yml'

# 权限说明：
#   discussions: write —— 同步时要把脱敏后的正文覆写回原帖。
#     只做静态站脱敏是不够的：仓库公开，Discussions 原文对未登录访客可见。
permissions:
  contents: write
  discussions: write
  pages: write
  id-token: write

concurrency:
  group: sync-discussions
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    # 防循环：覆写原帖会触发 discussion:edited 事件，
    # 若不拦截就会「同步 → 覆写 → 触发 → 同步」无限循环。
    # 机器人自己的编辑不再触发同步。
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: 同步并脱敏
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_OWNER: ${{ github.repository_owner }}
          GH_REPO: ${{ github.event.repository.name }}
          GH_CATEGORY: experiences
          # 兼容旧分类名：改名过渡期两边都拉，避免断档。
          # 确认改名完成、且旧分类下没有遗漏内容后，可以清空这一行。
          GH_CATEGORY_ALIASES: 经历
        run: node scripts/sync.js

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/posts.json site/posts.json site/desensitize.js
          # site/desensitize.js 是浏览器端的脱敏引擎（由 sync.js 从 scripts/ 拷贝），
          # 改了 scripts/desensitize.js 必须一起同步，否则站点预览用的是旧规则。
          # 只在「内容真的变了」时才提交。
          # posts.json 里的 generatedAt 每次生成都变，直接 diff 会导致
          # 每 30 分钟产生一个无意义 commit，把仓库历史刷满。
          # 所以剔除时间戳后再与 HEAD 版本比较。
          CHANGED=$(python3 -c "
          import json, subprocess
          def norm(s):
              try:
                  d = json.loads(s)
              except Exception:
                  return s
              d.get('stats', {}).pop('generatedAt', None)
              return json.dumps(d, sort_keys=True, ensure_ascii=False)
          old = subprocess.run(['git', 'show', 'HEAD:data/posts.json'],
                               capture_output=True, text=True).stdout
          new = open('data/posts.json', encoding='utf-8').read()
          print('true' if norm(old) != norm(new) else 'false')
          ")
          if [ "$CHANGED" = "true" ]; then
            git commit -m "chore: 同步论坛数据 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "内容无实质变化，跳过提交"
          fi

      # 反逆向加固：把 site/ 生成成 dist/，Pages 只发布加固版。
      # 为什么放在这里：sync.js 会重写 site/posts.json 与 site/desensitize.js，
      # 必须在同步完成后再加固，否则发布的是旧内容。
      #
      # 脚本自带三道校验（全局符号冲突 / 语法 / 运行等价），任一失败即
      # exit 1 → 本 workflow 失败 → 不会部署半成品。这是 fail-closed：
      # 宁可这次不更新，也不能把「能打开但功能全废」的站点推上线。
      # BLA 按需装到 runner 的临时目录，不需要仓库里有 package.json。
      - name: 反逆向加固站点产物（BLA）
        run: node scripts/harden-site.js

      - name: 部署到 GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: sync
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v5
