name: 敏感信息检查

# 为什么要单独一个 workflow：
#
#   pre-commit hook 是**本地**防线 —— 可以用 --no-verify 绕过，
#   也可以在别的机器上推送时根本不触发。
#   这个 workflow 是**服务器端**防线 —— 无论从哪推，GitHub 都会跑。
#
#   两层都不可省。hook 挡的是「手滑」，CI 挡的是「绕过」。
#
# 检查两样东西：
#   1. 当前文件树里有没有凭据 / 本机环境信息
#   2. 整个 git 历史里有没有（文件删了也不算数 —— GitHub 上按 SHA 直取 blob 依然有效）
#
# 这是一次真实的教训：
#   wrangler dev 留下的 .wrangler/ 目录被 git add -A 带进了历史，
#   里面有 Cloudflare 边缘节点诊断 —— 出口 IP、地理位置、运营商 ASN、
#   TLS 握手随机数。事后用 git-filter-repo 重写历史才清除掉。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 手动触发，方便随时复查
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-sensitive
  cancel-in-progress: true

jobs:
  scan:
    name: 扫描凭据与本机环境泄露
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # 必须带完整历史 —— 只查当前文件树会漏掉「已删除但仍在历史里」的内容
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: 扫描当前文件树
        run: node scripts/check-sensitive.js

      - name: 扫描整个 git 历史
        run: node scripts/check-sensitive-history.js

      - name: 复查工作区未被污染
        run: |
          # 上面两步都过了，说明当前与历史都干净。
          # 这一步是双保险：确认 CI 自己跑完之后没有引入新文件。
          git status --porcelain
          echo "工作区状态检查完成"
